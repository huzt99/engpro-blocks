name: Build catalog
on:
  push:
    branches: [main]
    paths-ignore: [catalog.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate catalog.json
        run: |
          python3 - <<'PY'
          import os, json
          CATS = {'door','window','struct','sanitary','mass','furn','tree','mep','other'}
          OK = {'.glb','.obj','.dxf','.skp','.dwg','.rfa','.pdf','.ifc','.3ds','.fbx','.rvt'}
          PREV = ['.glb', '.obj']
          items = []
          for root, _, files in os.walk('.'):
              if '.git' in root.split(os.sep): continue
              files = sorted(files)
              names = {os.path.splitext(f)[0]: f for f in files if os.path.splitext(f)[1].lower() in PREV}
              for f in files:
                  b, e = os.path.splitext(f)
                  if e.lower() not in OK: continue
                  path = os.path.join(root, f)[2:].replace(os.sep, '/')
                  top = path.split('/')[0] if '/' in path else 'other'
                  cat = top if top in CATS else 'other'
                  it = {'name': b.replace('_', ' ').replace('-', ' '), 'cat': cat, 'url': path, 'size': '%.1f MB' % (os.path.getsize(path) / 1048576)}
                  if e.lower() not in PREV and b in names:
                      it['preview'] = os.path.join(root, names[b])[2:].replace(os.sep, '/')
                  items.append(it)
          # a preview file next to a non-viewable original is not listed twice
          pv = {i['preview'] for i in items if 'preview' in i}
          items = [i for i in items if i['url'] not in pv]
          items.sort(key=lambda i: (i['cat'], i['name']))
          json.dump(items, open('catalog.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print(len(items), 'items')
          PY
      - name: Commit
        run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "update catalog" && git push)
